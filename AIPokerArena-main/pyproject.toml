[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-poker-arena"
version = "0.1.0"
description = "A teaching arena for poker-playing AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AI Poker Arena contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
arena = "arena.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arena"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["AGENTS.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
